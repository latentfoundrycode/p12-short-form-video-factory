name: CI

on:
  pull_request:
    branches: [main]

# Least privilege; the gate only reads the code.
permissions:
  contents: read

# Supersede stale runs on the same PR (Windows runners bill at 2x).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate
    runs-on: windows-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # --- Setup/install: these hard-stop the job if they fail (default success()
      # --- gating means nothing downstream runs). ---
      - name: Install Python dependencies (pinned; incl. editable SDK)
        id: deps_py
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Install frontend dependencies
        id: deps_fe
        working-directory: frontend
        run: npm ci

      - name: Install FFmpeg
        id: deps_ffmpeg
        run: choco install ffmpeg -y --no-progress

      - name: Install HyperFrames toolchain
        id: deps_hf
        env:
          HYPERFRAMES_SKIP_SKILLS: "1"
        run: |
          npm ci --prefix tools/hyperframes
          node tools/hyperframes/node_modules/hyperframes/bin/hyperframes.mjs browser ensure

      # --- The six-command gate. Each check runs even if a prior CHECK failed, so
      # --- one CI run surfaces ALL failing checks at once; but every check is skipped
      # --- if either install step failed, and any check failure fails the job. ---
      - name: ruff check
        if: ${{ !cancelled() && steps.deps_py.conclusion == 'success' && steps.deps_fe.conclusion == 'success' && steps.deps_ffmpeg.conclusion == 'success' }}
        run: python -m ruff check .

      - name: ruff format --check
        if: ${{ !cancelled() && steps.deps_py.conclusion == 'success' && steps.deps_fe.conclusion == 'success' && steps.deps_ffmpeg.conclusion == 'success' }}
        run: python -m ruff format --check .

      - name: mypy
        if: ${{ !cancelled() && steps.deps_py.conclusion == 'success' && steps.deps_fe.conclusion == 'success' && steps.deps_ffmpeg.conclusion == 'success' }}
        run: python -m mypy

      - name: eslint (npm run lint)
        if: ${{ !cancelled() && steps.deps_py.conclusion == 'success' && steps.deps_fe.conclusion == 'success' && steps.deps_ffmpeg.conclusion == 'success' }}
        working-directory: frontend
        run: npm run lint

      - name: tsc (npm run typecheck)
        if: ${{ !cancelled() && steps.deps_py.conclusion == 'success' && steps.deps_fe.conclusion == 'success' && steps.deps_ffmpeg.conclusion == 'success' }}
        working-directory: frontend
        run: npm run typecheck

      - name: pytest
        if: ${{ !cancelled() && steps.deps_py.conclusion == 'success' && steps.deps_fe.conclusion == 'success' && steps.deps_ffmpeg.conclusion == 'success' && steps.deps_hf.conclusion == 'success' }}
        env:
          HYPERFRAMES_SKIP_SKILLS: "1"
        run: python -m pytest
