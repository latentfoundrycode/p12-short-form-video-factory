[workflow]
id = "explainer"
name = "Explainer"
version = "1.0.0"
entrypoint = "main:run"
prepare = "main:prepare"
sdk = "1"
video_semantics = "variants"

[output]
aspect = "9:16"
fps = 30
safe_zone = "tiktok"

[[params]]
key = "topic"
type = "text"
label = "Topic"
required = false
help = "Leave empty to let the agent choose one."

[[params]]
key = "duration_s"
type = "number"
label = "Duration (seconds)"
default = 30
affects_cost = true

[[params]]
key = "voice"
type = "text"
label = "Narrator voice"
default = "narrator"

# OpenRouter powers the research + script LLM steps; the chassis injects this key into the run's
# context only because it is declared here (least-privilege allowlist, §5.6). Speech is local
# (Chatterbox/WhisperX) and needs no key.
[[requires_keys]]
name = "OPENROUTER_API_KEY"
label = "OpenRouter"
