# SFVF budget circuit-breaker configuration.
#
# ACTIVE ONLY when the SFVF_BUDGET_CONFIG environment variable points at this file. When it is unset
# a real paid call is refused (H21 fail-closed; no run spends ungated). Ledger + kill-switch live under
# SFVF_BUDGET_STATE (or a
# default state dir). To halt ALL paid calls immediately, create the kill-switch sentinel file in that
# state dir (default name: STOP).
#
# Amounts are per meter (provider). Units are never combined across meters:
#   openrouter → USD (reconciled from the real usage.cost after each call)
#   higgsfield → credits (estimate-capped only until a Stage-C reconcile — see HARDENING H20)
#
# NOTE: these are deliberately TIGHT proof-of-breaker floors for the attended first live run
# (OpenRouter, cheapest model, video_count=1 — cents at most). Raise them once a live run has been
# watched and the real per-video cost is known.

[openrouter]
per_run = 0.50   # USD — hard ceiling for a single run
per_day = 2.00   # USD — hard ceiling across all runs in a UTC day
estimate = 0.05  # USD — conservative amount reserved before each call

[higgsfield]
# Kling text-to-video (v2.5-turbo/pro), 5s / 9:16, video_count=1 — tight proof-of-breaker floors.
# The API gives no per-call credit cost (H20: no reconcile), so the REAL per-video credits are
# confirmed from the Higgsfield dashboard's balance delta at the attended stop and this estimate is
# bumped if it turns out < real (H20: estimate must be >= real). Provisional until then.
per_run = 15     # credits — one Kling-turbo 5s video (~a handful of credits); a 2nd is refused
per_day = 45     # credits — ~3 videos/day headroom, refuses runaway
estimate = 15    # credits reserved per video (conservative; >= expected real cost)
