[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sfvf"
version = "0.0.0"
description = "SFVF workflow SDK"
# >=3.12.4 (not just >=3.12) is a SECURITY floor for the media.web SSRF guard: CPython
# 3.12.0-3.12.3 misclassify several IPv6 forms that embed a private IPv4 (6to4 2002::/16,
# RFC 8215 local-use NAT64 64:ff9b:1::/48, Teredo 2001::/32) as globally routable, so
# `ipaddress.is_global` returns True for them and the fetch guard would admit an internal
# target. 3.12.4+ classifies them as non-global; combined with the explicit unwrap of the
# well-known NAT64 64:ff9b::/96 and IPv4-compat ::/96 forms (which stay is_global=True even
# on current CPython) in media.web._public_addr, the guard is version-independent on all
# supported interpreters. See docs/HARDENING.md H57.
requires-python = ">=3.12.4"
dependencies = [
    "pydantic>=2.13,<3",
]

# `media.edit` (trim/cut) wraps Kinocut's local/free FFmpeg-backed Client. It drags a
# heavy transitive stack (the MCP server: mcp/starlette/uvicorn/cryptography/pywin32),
# so it is an OPTIONAL extra — the core SDK stays lean and only environments that edit
# install it. The adapter lazy-imports it and raises a clear error if absent.
[project.optional-dependencies]
edit = [
    "kinocut==1.15.1",
]
openrouter = [
    "httpx2==2.10.0",
]
# `media.speech.speak` real mode synthesizes locally (Chatterbox TTS) and force-aligns the known
# text to the audio for word timings (WhisperX). Both drag a heavy GPU stack (torch, transformers,
# faster-whisper), so they are an OPTIONAL extra; the adapter lazy-imports them and raises a clear
# error if absent. NOTE: this extra pulls the *CPU* torch from PyPI. For GPU (CUDA) synthesis a
# speech-using workflow's requirements.txt must also pull the matching CUDA torch build from the
# PyTorch index, e.g. `--extra-index-url https://download.pytorch.org/whl/cu124` +
# `torch==2.6.0+cu124 torchaudio==2.6.0+cu124` (see workflows/explainer in Speech-2).
speech = [
    "chatterbox-tts==0.1.7",
    "whisperx==3.3.1",
    # Chatterbox's watermarker (resemble-perth) imports `pkg_resources`, removed in setuptools 81;
    # without this pin synthesis fails with PerthImplicitWatermarker = None.
    "setuptools<81",
]

[tool.hatch.build.targets.wheel]
packages = ["sfvf"]
