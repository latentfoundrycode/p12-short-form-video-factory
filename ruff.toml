target-version = "py312"
line-length = 100
exclude = ["venvs", "runs", "cache", "library", "archive", "staging", "frontend", ".venv", ".cursor"]

[lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "A", "C4", "SIM", "PTH", "RUF"]

[lint.per-file-ignores]
"workflows/**/*.py" = ["S603", "S607"]
"tests/**/*.py" = ["S101", "S108", "S404", "S603", "S607"]
"app/registry/schema.py" = ["A003"]
"app/core/env.py" = ["S404", "S603", "S607"]
