[mypy]
python_version = 3.12
files = app, sdk, tools
strict = True

[mypy-workflows.*]
ignore_missing_imports = True
follow_imports = skip

# Kinocut (the media.edit backend) ships no py.typed marker, so strict mypy cannot
# resolve its stubs. It is an optional runtime dependency wrapped by sdk/sfvf/media/edit.py.
[mypy-kinocut.*]
ignore_missing_imports = True

# Chatterbox (TTS) and WhisperX (forced alignment) are the optional `sfvf[speech]` GPU stack,
# lazy-imported by sdk/sfvf/media/speech.py and never installed in CI (tests mock the seams).
[mypy-chatterbox.*]
ignore_missing_imports = True

[mypy-whisperx.*]
ignore_missing_imports = True

[mypy-torchaudio.*]
ignore_missing_imports = True